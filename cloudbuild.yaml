# Cloud Build configuration for RankForge Platform
# Builds and deploys both frontend and workers to Cloud Run

steps:
  # ============================================
  # FRONTEND BUILD & DEPLOY
  # ============================================

  # Build frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rankforge-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rankforge-frontend:latest'
      - '.'
    id: 'build-frontend'

  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/rankforge-frontend:$COMMIT_SHA']
    id: 'push-frontend'
    waitFor: ['build-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/rankforge-frontend:latest']
    waitFor: ['build-frontend']

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'rankforge-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/rankforge-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']

  # ============================================
  # WORKERS BUILD & DEPLOY
  # ============================================

  # Build workers Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rankforge-workers:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rankforge-workers:latest'
      - './workers'
    id: 'build-workers'

  # Push workers image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/rankforge-workers:$COMMIT_SHA']
    id: 'push-workers'
    waitFor: ['build-workers']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/rankforge-workers:latest']
    waitFor: ['build-workers']

  # Deploy workers to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'rankforge-workers'
      - '--image'
      - 'gcr.io/$PROJECT_ID/rankforge-workers:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'NODE_ENV=production'
      - '--set-secrets'
      - 'SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_KEY=SUPABASE_SERVICE_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest'
    id: 'deploy-workers'
    waitFor: ['push-workers']

images:
  - 'gcr.io/$PROJECT_ID/rankforge-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/rankforge-frontend:latest'
  - 'gcr.io/$PROJECT_ID/rankforge-workers:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/rankforge-workers:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
