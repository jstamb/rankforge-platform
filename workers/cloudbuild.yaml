# Cloud Build configuration for deploying RankForge Workers to Cloud Run
# Run with: gcloud builds submit --config cloudbuild.yaml

steps:
  # Build the Docker image (--no-cache to ensure fresh build with latest code)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rankforge-workers:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rankforge-workers:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/rankforge-workers:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/rankforge-workers:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'rankforge-workers'
      - '--image'
      - 'gcr.io/$PROJECT_ID/rankforge-workers:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'NODE_ENV=production'
      - '--set-secrets'
      - 'SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_KEY=SUPABASE_SERVICE_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest'

images:
  - 'gcr.io/$PROJECT_ID/rankforge-workers:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/rankforge-workers:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
